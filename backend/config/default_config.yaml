# LibrarySquirrel Go 服务配置（生产环境默认值）

server:
  port: 8080
  mode: release

database:
  path: database/database.db

log:
  level: info
  format: console
  maxSize: 2
  maxBackups: 3
  maxAge: 30
  compress: false

app:
  host: 127.0.0.1
  resourcePath: ./resources
  dataPath: ./data

task:
  useSnapshotMode: true
  operationCooldownMs: 1500

sites:
  - name: local
    description: 此电脑
  - name: pixiv
    description: |
      pixiv是喜欢插画、对插画感兴趣的朋友们的交流平台。在这里，您可以投稿自己的插画作品，并与其他用户轻松展开交流。
      注册・使用免费。

# 捆绑插件（首次启动时自动安装）
plugins:
  - packagePath: resources/bundled-plugins/pixiv-plugin.zip
    pathType: Relative
  - packagePath: resources/bundled-plugins/local-plugin.zip
    pathType: Relative
  - packagePath: resources/bundled-plugins/bilibili-plugin.zip
    pathType: Relative
